services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-churchsmng}
      POSTGRES_USER: ${DB_USER:-churchsmng}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em .env.prod}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-churchsmng}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${DB_USER:-churchsmng}:${DB_PASSWORD}@db:5432/${DB_NAME:-churchsmng}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static:/app/staticfiles
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO em .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
      - flutter_web:/srv/flutter:ro
    depends_on:
      - backend

volumes:
  db_data:
  static:
  media:
  caddy_data:
  caddy_config:
  flutter_web:
